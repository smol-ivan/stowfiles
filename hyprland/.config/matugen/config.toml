[config]

    
[config.wallpaper]

set = true

command = "awww img {{ image }} --transition-type any --outputs DP-1,HDMI-A-1 --transition-fps 100"

# [templates.qt6ct]
# input_path = '~/.config/matugen/templates/qtct.conf'
# output_path = '~/.config/qt6ct/colors/matugen.conf'

[templates.dunst]
input_path = '~/.config/matugen/templates/dunstrc-colors'
output_path = '~/.config/dunst/dunstrc'
post_hook = 'dunstctl reload'

[templates.wlogout]
input_path = '~/.config/matugen/templates/wlogout.css'
output_path = '~/.config/wlogout/colors.css'

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprland-colors.conf'
output_path = '~/.config/hypr/colors.conf'

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland-colors.lua'
output_path = '~/.config/hypr/colors.lua'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/colors.css'
# post_hook = 'gsettings set org.gnome.desktop.interface gtk-theme ""; gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3-{{mode}}'

[templates.gtk4]
input_path =  '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/colors.css'

# [templates.ghostty]
# input_path = '~/.config/matugen/templates/ghostty.txt'
# output_path = '~/.config/ghostty/colors.txt'

[templates.rofi]
input_path = '~/.config/matugen/templates/rofi-colors.rasi'
output_path = '~/.config/rofi/colors.rasi'

# [templates.tmux]
# input_path = '~/.config/matugen/templates/tmux-colors.conf'
# output_path = '~/.config/tmux/colors.conf'

[templates.waybar]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/waybar/colors.css'
post_hook = 'killall -9 waybar; waybar &'

