[accessibility]
ui_scale = 1.2500000111758709

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1024.0
    cy = 1006.4000244140625
    output = "DP-1"
    placement_height = 1152.0
    placement_width = 2048.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
font_family = "Iosevka Nerd Font Propo"
password_style = "random"
polkit_agent = true
telemetry_enabled = true

[theme]
builtin = "Kanagawa"

    [theme.templates]
    builtin_ids = [ "hyprland" ]

[wallpaper]
directory = "/home/chattini/bone/wallpapers/.wallpapers"

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/chattini/bone/wallpapers/.wallpapers/wallhaven-qrrmp5.jpg"

    [wallpaper.last]
    path = "/home/chattini/bone/wallpapers/.wallpapers/wallhaven-qrrmp5.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/chattini/bone/wallpapers/.wallpapers/wallhaven-qrrmp5.jpg"

