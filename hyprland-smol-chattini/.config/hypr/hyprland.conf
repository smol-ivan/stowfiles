source = ~/.config/hypr/colors.conf

monitor=DP-1,2560x1440@99.95,0x0,1.25
# monitor=HDMI-A-1,disabled
monitor=HDMI-A-1, 1920x1080@60.00,auto-up,1.25

workspace = 1, monitor:DP-1, persistent:true
workspace = 2, monitor:DP-1, persistent:true
workspace = 3, monitor:DP-1, persistent:true
workspace = 4, monitor:DP-1, persistent:true
workspace = 5, monitor:HDMI-A-1, persistent:true

xwayland {
    force_zero_scaling = true
    }

$terminal = alacritty
$fileManager = thunar
$menu = pkill rofi || .config/rofi/launchers/type-1/launcher.sh
$clipboard = cliphist list | rofi -dmenu -display-columns 2 -p "Clipboard" -theme .config/rofi/launchers/type-1/style-3.rasi | cliphist decode | wl-copy
$waybar = killall -9 waybar || waybar &
$da_script = /home/chattini/.local/bin/change_wallpaper
$llogout = wlogout
$da_ss = grim -g "$(slurp)" ~/Screenshot/$(date +%Y-%m-%d_%H-%m-%s).png

$mainMod = SUPER 

bind = $mainMod, Print, exec, $da_ss
bind = $mainMod SHIFT, e, exec, $llogout
bind = $mainMod SHIFT, H, exec, $da_script
bind = $mainMod, H, exec, $waybar
bind = $mainMod, return, exec, $terminal
bind = $mainMod SHIFT, q, killactive,
# bind = $mainMod SHIFT, k, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, V, exec, $clipboard
bind = $mainMod, E, exec, $fileManager
bind = $mainMod SHIFT, T, togglefloating,
bind = $mainMod, space, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod SHIFT, J, togglesplit, # dwindle
bind = $mainMod, F, fullscreen, 1
bind = $mainMod SHIFT, F, fullscreenstate, 2, 0

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

exec-once = systemctl --user start hyprpolkitagent & awww-daemon & waybar & hyprctl setcursor Imouto 30 & hypridle
exec-once = wl-paste --type text --watch cliphist store # Stores only text data

# env = QT_QPA_PLATFORM,wayland;xcb
# env = QT_QPA_PLATFORMTHEME,qt6ct
# env = QT_QPA_PLATFORMTHEME_QT6,qt6ct
# env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
# env = XDG_MENU_PREFIX,arch-
# env = XDG_CURRENT_DESKTOP,KDE
# env = XDG_CURRENT_DESKTOP,gnome
env = XCURSOR_SIZE,30
env = HYPRCURSOR_SIZE,30
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

general {
    gaps_in = 3
    gaps_out = 10

    border_size = 2

    col.active_border = $primary
    col.inactive_border = $outline

    resize_on_border = false

    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 0.97
    inactive_opacity = 0.93

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

animations {
    enabled = no, please :)

}

dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}

input {
    kb_layout = us,us
    kb_variant = colemak_dh_wide,
    kb_options = grp:rctrl_toggle
}
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

# Sustituye 'DP-1' por el nombre de tu monitor donde sí funciona
# windowrulev2 = monitor HDMI-A-1, class:^(steam)$
